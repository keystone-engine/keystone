name: CI

on:
  push:
    branches: [master, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: nix develop --command bash -euo pipefail -c 'cargo fmt --all --check && taplo fmt --check'

      - name: Clippy
        if: ${{ !cancelled() }}
        run: nix develop --command cargo clippy --workspace --all-targets --release --features keystone-engine/arch_all -- -D warnings

      - name: Test
        if: ${{ !cancelled() }}
        run: >-
          nix develop --command bash -euo pipefail -c
          'cargo nextest run --workspace --release --features keystone-engine/arch_all
          && cargo test --doc --workspace --release --features keystone-engine/arch_all'

  nix:
    name: Nix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Flake check
        run: nix flake check --no-build

  gcc:
    name: GCC
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build
        run: >-
          nix shell --inputs-from . nixpkgs#gcc nixpkgs#cmake nixpkgs#ninja --command
          bash -euo pipefail -c
          'CC=gcc CXX=g++ cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build'

  actions:
    name: Actions lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # actionlint 1.7.12 predates the ubuntu-26.04 runner images
      # (rhysd/actionlint#743).
      - name: actionlint
        run: >-
          nix shell nixpkgs#actionlint nixpkgs#shellcheck --command
          actionlint -ignore 'label "ubuntu-26\.04(-arm)?" is unknown'

      - name: zizmor
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix run nixpkgs#zizmor -- --format github .
